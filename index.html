  <script>
    /* ── Pre-clear GECX session storage ──────────────────────────────────────────
       The GECX SDK (deferred) reads sessionStorage when the <chat-messenger>
       custom element first registers its context. If the previous page load left
       an authenticated CES session token in storage, the SDK reuses that session
       and the before_model_callback sees the old customer name even though the
       frontend is now in guest mode.

       Running this clear synchronously (inline, before any defer script) beats the
       SDK to the read. Only our own 'acn_' keys are preserved; everything else is
       assumed to belong to the SDK.
    ── */
    (function () {
      try {
        var keys = Object.keys(sessionStorage);
        for (var i = 0; i < keys.length; i++) {
          if (!keys[i].startsWith('acn_')) sessionStorage.removeItem(keys[i]);
        }
      } catch (e) { /* storage may be restricted (e.g. private browsing) — ignore */ }
    })();
  </script>
  <script>
    /* DISABLED: Fetch interceptor that fired acn-session-data events.
       The canonical response path is now gecx.js installFetchInterceptor(),
       which extracts data.outputs directly from runSession responses.
       Disabling this prevents duplicate response processing.
       
       Original code:
       (function () {
         var _origFetch = window.fetch;
         window.fetch = function () {
           var p = _origFetch.apply(this, arguments);
           var raw = arguments[0];
           var url = (raw && typeof raw === 'object' && raw.url) ? raw.url : String(raw || '');
           if (url.indexOf('runSession') !== -1) {
             p.then(function (r) {
               r.clone().json().then(function (d) {
                 if (d && d.messages) {
                   window.dispatchEvent(new CustomEvent('acn-session-data', { detail: d }));
                 }
               }).catch(function () {});
             }).catch(function () {});
           }
           return p;
         };
       })();
    */
  </script>
