openapi: 3.0.3
info:
  title: Send Application Email - Direct Firestore
  version: 1.0.0
  description: Template-based email notification API for ACN Bank CES Demo (Direct Firestore email queue)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/email_queue:
    post:
      operationId: executeACNBankApplicationEmail
      summary: Send a template-based email notification to a customer
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendEmailRequest'
      responses:
        '200':
          description: Email sent successfully
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Send a template-based email notification to a customer
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    SendEmailRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, templateId, recipientEmail, templateData (required: templateId, recipientEmail). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - templateId
        - recipientEmail
        - templateData
        required:
        - templateId
        - recipientEmail
        col: null
