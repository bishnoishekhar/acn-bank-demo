openapi: "3.0.3"
info:
  title: Cheque Services DB - Direct Firestore
  version: "1.0.0"
  description: Cheque services API for stop payments, cheque books, and bank drafts (Direct Firestore)
servers:
  - url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/stop_payments:
    post:
      operationId: createStopPayment
      summary: Place a stop payment on a cheque
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStopPaymentRequest"
      responses:
        "200":
          description: Stop payment created
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/stop_payments/{stopPaymentId}:
    get:
      operationId: getStopPaymentStatus
      summary: Get the status of a stop payment request
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: stopPaymentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stop payment status
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/cheque_book_orders:
    post:
      operationId: createChequeBookOrder
      summary: Order a new cheque book
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChequeBookOrderRequest"
      responses:
        "200":
          description: Cheque book order placed
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/bank_drafts:
    post:
      operationId: createBankDraft
      summary: Request a certified cheque or bank draft
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBankDraftRequest"
      responses:
        "200":
          description: Bank draft order created
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    CreateStopPaymentRequest:
      type: object
      required:
        - customerId
        - accountId
        - chequeNumber
        - amount
        - reason
      properties:
        customerId:
          type: string
        accountId:
          type: string
        chequeNumber:
          type: string
        amount:
          type: number
        payee:
          type: string
        reason:
          type: string
        idempotencyKey:
          type: string
    CreateChequeBookOrderRequest:
      type: object
      required:
        - customerId
        - accountId
        - quantity
      properties:
        customerId:
          type: string
        accountId:
          type: string
        quantity:
          type: integer
          enum: [25, 50, 100]
        deliveryAddress:
          type: object
        idempotencyKey:
          type: string
    CreateBankDraftRequest:
      type: object
      required:
        - customerId
        - amount
        - currency
        - payee
      properties:
        customerId:
          type: string
        fromAccountId:
          type: string
        amount:
          type: number
        currency:
          type: string
          enum: [CAD, USD]
        payee:
          type: string
        memo:
          type: string
        pickupBranchId:
          type: string
        deliveryAddress:
          type: object
        idempotencyKey:
          type: string