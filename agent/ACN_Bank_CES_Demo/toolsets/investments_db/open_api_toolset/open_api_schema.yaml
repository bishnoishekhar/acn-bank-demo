openapi: 3.0.3
info:
  title: Investments DB - Direct Firestore
  version: 1.0.0
  description: Investment account information API for ACN Bank CES Demo (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/investment_accounts:
    get:
      operationId: getInvestmentAccounts
      summary: Get investment accounts for a customer (TFSA, RRSP, FHSA, GIC, non-registered)
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Investment accounts
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/gic_rates:
    get:
      operationId: getGICRates
      summary: Get current GIC interest rates by term and currency
      security:
      - GoogleBearerAuth: []
      responses:
        '200':
          description: GIC rates
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/contribution_room/summary:
    get:
      operationId: getContributionRoom
      summary: Get TFSA, RRSP, or FHSA contribution room for a customer
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Contribution room details
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/investment_holdings:
    get:
      operationId: getInvestmentHoldings
      summary: Get current investment holdings for a customer
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Investment holdings
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas: {}
