openapi: "3.0.3"
info:
  title: New Transaction API DB - Direct Firestore
  version: "1.0.0"
  description: Money movement API for transactions and recurring payment schedules (Direct Firestore)
servers:
  - url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/transactions:
    post:
      operationId: createTransaction
      summary: Create a new money movement transaction (transfer, payment, bill pay)
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTransactionRequest"
      responses:
        "200":
          description: Transaction created
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/transactions/{transactionId}:
    patch:
      operationId: updateTransaction
      summary: Update transaction status or details
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: transactionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTransactionRequest"
      responses:
        "200":
          description: Transaction updated
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/recurring_schedules:runQuery:
    post:
      operationId: listRecurringSchedules
      summary: List recurring payment schedules for a customer
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ListRecurringSchedulesRequest"
      responses:
        "200":
          description: List of recurring schedules
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/recurring_schedules:
    post:
      operationId: createRecurringSchedule
      summary: Create a new recurring payment schedule
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRecurringScheduleRequest"
      responses:
        "200":
          description: Recurring schedule created
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/recurring_schedules/{scheduleId}:
    patch:
      operationId: updateRecurringSchedule
      summary: Update a recurring payment schedule
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRecurringScheduleRequest"
      responses:
        "200":
          description: Schedule updated
          content:
            application/json:
              schema:
                type: object
    delete:
      operationId: cancelRecurringSchedule
      summary: Cancel a recurring payment schedule
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: scheduleId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Schedule cancelled
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    CreateTransactionRequest:
      type: object
      required:
        - customerId
        - fromAccountId
        - amount
        - currency
        - type
        - idempotencyKey
      properties:
        customerId:
          type: string
        fromAccountId:
          type: string
        toAccountId:
          type: string
        toBeneficiaryId:
          type: string
        toBillId:
          type: string
        amount:
          type: number
        currency:
          type: string
          default: CAD
        type:
          type: string
          enum: [internal_transfer, e_transfer, bill_payment, wire]
        memo:
          type: string
        scheduledDate:
          type: string
        idempotencyKey:
          type: string
    UpdateTransactionRequest:
      type: object
      properties:
        status:
          type: string
        failureReason:
          type: string
    ListRecurringSchedulesRequest:
      type: object
      required:
        - customerId
      properties:
        customerId:
          type: string
    CreateRecurringScheduleRequest:
      type: object
      required:
        - customerId
        - fromAccountId
        - amount
        - frequency
        - startDate
      properties:
        customerId:
          type: string
        fromAccountId:
          type: string
        toAccountId:
          type: string
        toBeneficiaryId:
          type: string
        toBillId:
          type: string
        amount:
          type: number
        currency:
          type: string
          default: CAD
        frequency:
          type: string
          enum: [weekly, biweekly, monthly, quarterly]
        startDate:
          type: string
        endDate:
          type: string
        memo:
          type: string
        idempotencyKey:
          type: string
    UpdateRecurringScheduleRequest:
      type: object
      properties:
        amount:
          type: number
        frequency:
          type: string
        nextRunDate:
          type: string
        endDate:
          type: string
        status:
          type: string