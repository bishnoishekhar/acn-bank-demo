openapi: 3.0.3
info:
  title: New Transaction API DB - Direct Firestore
  version: 1.0.0
  description: Money movement API for transactions and recurring payment schedules (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/transactions:
    post:
      operationId: createTransaction
      summary: Create a money movement transaction (internal transfer, e-transfer, bill payment, wire) in the customer's transaction history
      description: Pass the transaction as a PLAIN key/value map in `fields` (customerId, fromAccountId, amount, currency, type, counterpartyName and ONE of toAccountId / toBeneficiaryId / toBillId, optional memo). customerId and documentId are filled in for you. Do NOT format values for Firestore; that conversion is done for you.
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTransactionRequest'
      responses:
        '200':
          description: Transaction created
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/transactions/{transactionId}:
    patch:
      operationId: updateTransaction
      summary: Update transaction status or details
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          type: string
      - name: customerId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTransactionRequest'
      responses:
        '200':
          description: Transaction updated
          content:
            application/json:
              schema:
                type: object
      description: Update transaction status or details
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents:runQuery:
    post:
      operationId: listRecurringSchedules
      summary: List recurring payment schedules for a customer
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListRecurringSchedulesRequest'
      responses:
        '200':
          description: List of recurring schedules
          content:
            application/json:
              schema:
                type: object
      description: List recurring payment schedules for a customer
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/recurring_schedules:
    post:
      operationId: createRecurringSchedule
      summary: Create a new recurring payment schedule
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRecurringScheduleRequest'
      responses:
        '200':
          description: Recurring schedule created
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Create a new recurring payment schedule
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/recurring_schedules/{scheduleId}:
    patch:
      operationId: updateRecurringSchedule
      summary: Update a recurring payment schedule
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRecurringScheduleRequest'
      responses:
        '200':
          description: Schedule updated
          content:
            application/json:
              schema:
                type: object
      description: Update a recurring payment schedule
    delete:
      operationId: cancelRecurringSchedule
      summary: Cancel a recurring payment schedule
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: scheduleId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Schedule cancelled
          content:
            application/json:
              schema:
                type: object
      description: Cancel a recurring payment schedule
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    CreateTransactionRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map: customerId, fromAccountId, amount (number), currency (CAD), type (internal_transfer | e_transfer | bill_payment | wire | credit_card_payment | qr_pay), counterpartyName, memo, and one of toAccountId / toBeneficiaryId / toBillId.'
          additionalProperties: true
    UpdateTransactionRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: status, failureReason. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - status
        - failureReason
        required: []
        col: null
    ListRecurringSchedulesRequest:
      type: object
      properties:
        structuredQuery:
          type: object
          description: Do NOT build this yourself. Pass the filters as plain arguments (customerId) and the Firestore query is built for you.
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        required: []
        col: recurring_schedules
    CreateRecurringScheduleRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, fromAccountId, toAccountId, toBeneficiaryId, toBillId, amount, currency, frequency, startDate, endDate, memo (required: fromAccountId, amount, frequency, startDate). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - fromAccountId
        - toAccountId
        - toBeneficiaryId
        - toBillId
        - amount
        - currency
        - frequency
        - startDate
        - endDate
        - memo
        required:
        - fromAccountId
        - amount
        - frequency
        - startDate
        col: null
    UpdateRecurringScheduleRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: amount, frequency, nextRunDate, endDate, status. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - amount
        - frequency
        - nextRunDate
        - endDate
        - status
        required: []
        col: null
