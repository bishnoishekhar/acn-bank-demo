openapi: 3.0.3
info:
  title: Disputes DB - Direct Firestore
  version: 1.0.0
  description: Dispute creation, retrieval, update, and PAD dispute handling API (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/disputes/{disputeId}:
    get:
      operationId: getDispute
      summary: Get dispute details by ID
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Dispute details
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: updateDispute
      summary: Update an existing dispute
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: disputeId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDisputeRequest'
      responses:
        '200':
          description: Dispute updated
          content:
            application/json:
              schema:
                type: object
      description: Update an existing dispute
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/disputes:
    post:
      operationId: createDispute
      summary: Create a new transaction dispute or chargeback
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDisputeRequest'
      responses:
        '200':
          description: Dispute created
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Create a new transaction dispute or chargeback
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/pad_disputes:
    post:
      operationId: createPADDispute
      summary: Create a Pre-Authorized Debit dispute
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePADDisputeRequest'
      responses:
        '200':
          description: PAD dispute created
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Create a Pre-Authorized Debit dispute
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    CreateDisputeRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, transactionId, type, amount, description (required: transactionId, type, amount). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - transactionId
        - type
        - amount
        - description
        required:
        - transactionId
        - type
        - amount
        col: null
    UpdateDisputeRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: status, resolution, additionalInfo. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - status
        - resolution
        - additionalInfo
        required: []
        col: null
    CreatePADDisputeRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, padId, amount, reason, cpaRule (required: padId, amount, reason). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - padId
        - amount
        - reason
        - cpaRule
        required:
        - padId
        - amount
        - reason
        col: null
