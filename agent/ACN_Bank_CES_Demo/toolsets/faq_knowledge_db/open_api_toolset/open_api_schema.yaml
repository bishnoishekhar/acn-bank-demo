openapi: "3.0.3"
info:
  title: FAQ Knowledge DB - Direct Firestore
  version: "1.0.0"
  description: FAQ and knowledge base search API for ACN Bank CES Demo (Direct Firestore)
servers:
  - url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/faqs:runQuery:
    post:
      operationId: searchFAQs
      summary: Search FAQ knowledge base by query string
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FAQSearchRequest"
      responses:
        "200":
          description: Matching FAQ results
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/faqs/{faqId}:
    get:
      operationId: getFAQ
      summary: Get a specific FAQ by ID
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: faqId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: FAQ details
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/faq_categories:
    get:
      operationId: listFAQCategories
      summary: List all available FAQ categories
      security:
        - GoogleBearerAuth: []
      parameters:
      responses:
        "200":
          description: List of FAQ categories
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    FAQSearchRequest:
      type: object
      required:
        - q
      properties:
        q:
          type: string
          description: Search query string
        category:
          type: string
          description: Filter by FAQ category
        language:
          type: string
          default: en
          enum: [en, fr]
        limit:
          type: integer
          default: 10
          maximum: 50