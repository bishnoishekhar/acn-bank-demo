openapi: "3.0.3"
info:
  title: Loan Applications - Direct Firestore
  version: "1.0.0"
  description: Loan and mortgage application lifecycle API for ACN Bank CES Demo (Direct Firestore)
servers:
  - url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/loan_applications:runQuery:
    post:
      operationId: queryLoanApplications
      summary: Query loan applications by customer, type, or status
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryLoanApplicationsRequest"
      responses:
        "200":
          description: List of loan applications
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/loan_applications:
    post:
      operationId: createLoanApplication
      summary: Create a new loan or mortgage application
      security:
        - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLoanApplicationRequest"
      responses:
        "200":
          description: Loan application created
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/loan_applications/{applicationId}:
    patch:
      operationId: updateLoanApplication
      summary: Update an existing loan application
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLoanApplicationRequest"
      responses:
        "200":
          description: Loan application updated
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/loan_applications/{applicationId}/mortgage_details/details:
    get:
      operationId: getMortgageDetails
      summary: Get detailed mortgage information for a mortgage application
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Mortgage details
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    QueryLoanApplicationsRequest:
      type: object
      properties:
        customerId:
          type: string
        type:
          type: string
          enum: [personal_loan, auto_loan, mortgage, heloc, line_of_credit]
        status:
          type: string
          enum: [pending, in_review, approved, declined, funded, cancelled]
    CreateLoanApplicationRequest:
      type: object
      required:
        - customerId
        - type
        - amount
      properties:
        customerId:
          type: string
        type:
          type: string
        amount:
          type: number
        term:
          type: integer
        purpose:
          type: string
        propertyValue:
          type: number
        downPayment:
          type: number
        employmentStatus:
          type: string
        annualIncome:
          type: number
        idempotencyKey:
          type: string
    UpdateLoanApplicationRequest:
      type: object
      properties:
        status:
          type: string
        approvedAmount:
          type: number
        approvedRate:
          type: number
        decisionReason:
          type: string
        applicationData:
          type: object