openapi: 3.0.3
info:
  title: Account Opening DB - Direct Firestore
  version: 1.0.0
  description: Account opening workflow API for ACN Bank CES Demo (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/account_products:
    get:
      operationId: getAccountProducts
      summary: Get available account products and their eligibility criteria
      security:
      - GoogleBearerAuth: []
      responses:
        '200':
          description: Available account products
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/account_applications/{applicationId}:
    get:
      operationId: getAccountApplicationStatus
      summary: Get the status of an account opening application
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application status
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: updateAccountApplication
      summary: Update an account opening application
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAccountApplicationRequest'
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                type: object
      description: Update an account opening application
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/account_applications:
    post:
      operationId: createAccountApplication
      summary: Create a new account opening application
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAccountApplicationRequest'
      responses:
        '200':
          description: Account application created
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Create a new account opening application
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    CreateAccountApplicationRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, productId, applicationData (required: productId). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - productId
        - applicationData
        required:
        - productId
        col: null
    UpdateAccountApplicationRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: status, decisionReason, applicationData. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - status
        - decisionReason
        - applicationData
        required: []
        col: null
