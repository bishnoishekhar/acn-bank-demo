openapi: 3.0.3
info:
  title: Digital Activation DB - Direct Firestore
  version: 1.0.0
  description: Card activation, digital wallet, and online banking activation tracking API (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/activation_requests/{requestId}:
    get:
      operationId: getActivationStatus
      summary: Get the status of an activation request
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Activation request status
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: updateActivationRequest
      summary: Update an activation request (e.g. mark completed or failed)
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActivationRequest'
      responses:
        '200':
          description: Activation request updated
          content:
            application/json:
              schema:
                type: object
      description: Update an activation request (e.g. mark completed or failed)
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/activation_requests:
    post:
      operationId: createActivationRequest
      summary: Create a new activation request for card, digital wallet, or online banking
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateActivationRequest'
      responses:
        '200':
          description: Activation request created
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Create a new activation request for card, digital wallet, or online banking
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    CreateActivationRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, activationType, cardId, channel, deviceInfo, requestedAmount, details (required: activationType). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - activationType
        - cardId
        - channel
        - deviceInfo
        - requestedAmount
        - details
        required:
        - activationType
        col: null
    UpdateActivationRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: status, failureReason, completionData. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - status
        - failureReason
        - completionData
        required: []
        col: null
