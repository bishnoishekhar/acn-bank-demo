openapi: 3.0.3
info:
  title: Card Applications - Direct Firestore
  version: 1.0.0
  description: Credit card application lifecycle API for ACN Bank CES Demo (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/card_applications/{applicationId}:
    get:
      operationId: getApplicationStatus
      summary: Get the status of a specific card application
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Application status
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: updateApplication
      summary: Update an existing card application
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateApplicationRequest'
      responses:
        '200':
          description: Application updated
          content:
            application/json:
              schema:
                type: object
      description: Update an existing card application
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents:runQuery:
    post:
      operationId: queryApplications
      summary: Query credit card applications by customer or status
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueryApplicationsRequest'
      responses:
        '200':
          description: List of card applications
          content:
            application/json:
              schema:
                type: object
      parameters: []
      description: Query credit card applications by customer or status
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/card_applications:
    post:
      operationId: createApplication
      summary: Create a new credit card application
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '200':
          description: Application created
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Create a new credit card application
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/card_applications/{applicationId}/persist_approved:
    post:
      operationId: persistApprovedCreditCardApplication
      summary: Persist an approved card application and activate the card record
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: applicationId
        in: path
        required: true
        schema:
          type: string
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersistApprovedRequest'
      responses:
        '200':
          description: Approved application persisted
          content:
            application/json:
              schema:
                type: object
      description: Persist an approved card application and activate the card record
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    QueryApplicationsRequest:
      type: object
      properties:
        structuredQuery:
          type: object
          description: Do NOT build this yourself. Pass the filters as plain arguments (customerId, status) and the Firestore query is built for you.
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - status
        required: []
        col: card_applications
    CreateApplicationRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, cardType, applicationData (required: cardType). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - cardType
        - applicationData
        required:
        - cardType
        col: null
    UpdateApplicationRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: status, applicationData, decisionReason, approvedCreditLimit. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - status
        - applicationData
        - decisionReason
        - approvedCreditLimit
        required: []
        col: null
    PersistApprovedRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: approvedCreditLimit, cardType, cardNumber, expiryDate. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - approvedCreditLimit
        - cardType
        - cardNumber
        - expiryDate
        required: []
        col: null
