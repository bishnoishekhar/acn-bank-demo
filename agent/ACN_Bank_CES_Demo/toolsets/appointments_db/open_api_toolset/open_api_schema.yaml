openapi: 3.0.3
info:
  title: Appointments DB - Direct Firestore
  version: 1.0.0
  description: Branch appointment management API for ACN Bank CES Demo (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/appointment_slots:
    get:
      operationId: getAvailableSlots
      summary: Get available appointment slots at a branch
      security:
      - GoogleBearerAuth: []
      responses:
        '200':
          description: Available appointment slots
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/appointments/{appointmentId}:
    get:
      operationId: getAppointment
      summary: Get appointment details
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Appointment details
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: updateAppointment
      summary: Update an existing appointment (reschedule, update notes)
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAppointmentRequest'
      responses:
        '200':
          description: Appointment updated
          content:
            application/json:
              schema:
                type: object
      description: Update an existing appointment (reschedule, update notes)
    delete:
      operationId: cancelAppointment
      summary: Cancel an appointment
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: appointmentId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Appointment cancelled
          content:
            application/json:
              schema:
                type: object
      description: Cancel an appointment
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/appointments:
    post:
      operationId: createAppointment
      summary: Book a new branch appointment
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAppointmentRequest'
      responses:
        '200':
          description: Appointment booked
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Book a new branch appointment
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    CreateAppointmentRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, branchId, slotId, serviceType, notes, sendConfirmationEmail (required: branchId, slotId, serviceType). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - branchId
        - slotId
        - serviceType
        - notes
        - sendConfirmationEmail
        required:
        - branchId
        - slotId
        - serviceType
        col: null
    UpdateAppointmentRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: slotId, notes, status. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - slotId
        - notes
        - status
        required: []
        col: null
