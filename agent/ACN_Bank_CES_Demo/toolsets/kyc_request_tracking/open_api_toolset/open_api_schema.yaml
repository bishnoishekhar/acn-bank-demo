openapi: 3.0.3
info:
  title: KYC Request Tracking - Direct Firestore
  version: 1.0.0
  description: KYC request creation, status tracking, and record writing API (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/kyc_requests/{requestId}:
    get:
      operationId: getKycStatus
      summary: Get the status of a KYC verification request
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: KYC request status
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: writeKycRecord
      summary: Write KYC verification outcome and extracted entities
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: requestId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteKycRecordRequest'
      responses:
        '200':
          description: KYC record written
          content:
            application/json:
              schema:
                type: object
      description: Write KYC verification outcome and extracted entities
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/kyc_requests:
    post:
      operationId: createKycRequest
      summary: Create a new KYC identity verification request
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKycRequest'
      responses:
        '200':
          description: KYC request created
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Create a new KYC identity verification request
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    CreateKycRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, channel, documentType, purpose (required: channel, documentType). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - channel
        - documentType
        - purpose
        required:
        - channel
        - documentType
        col: null
    WriteKycRecordRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: entities, confidence, outcome, failureReason (required: outcome). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - entities
        - confidence
        - outcome
        - failureReason
        required:
        - outcome
        col: null
