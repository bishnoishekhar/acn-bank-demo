openapi: "3.0.3"
info:
  title: Overdraft PAD DB - Direct Firestore
  version: "1.0.0"
  description: Overdraft protection, NSF history/reversal, and PAD management API (Direct Firestore)
servers:
  - url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/overdraft/settings:
    get:
      operationId: getOverdraftDetails
      summary: Get overdraft protection details and settings for a customer
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Overdraft protection details
          content:
            application/json:
              schema:
                type: object
    patch:
      operationId: updateOverdraftProtection
      summary: Enable, disable, or change linked account for overdraft protection
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOverdraftProtectionRequest"
      responses:
        "200":
          description: Overdraft protection updated
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/pads:
    get:
      operationId: listPADs
      summary: List Pre-Authorized Debit agreements for a customer
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, cancelled, all]
      responses:
        "200":
          description: List of PAD agreements
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/pads/{padId}:
    patch:
      operationId: cancelPAD
      summary: Cancel a Pre-Authorized Debit agreement
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
        - name: padId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelPADRequest"
      responses:
        "200":
          description: PAD agreement cancelled
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/pad_disputes:
    post:
      operationId: createPADDispute
      summary: File a dispute for an unauthorized or incorrect Pre-Authorized Debit
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePADDisputeRequest"
      responses:
        "200":
          description: PAD dispute filed
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/nsf_history:
    get:
      operationId: getNSFHistory
      summary: Get NSF (non-sufficient funds) fee history for a customer
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: startDate
          in: query
          schema:
            type: string
      responses:
        "200":
          description: NSF fee history
          content:
            application/json:
              schema:
                type: object
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/customers/{customerId}/nsf_reversals:
    post:
      operationId: createNSFReversal
      summary: Request reversal of an NSF fee (goodwill or policy-based)
      security:
        - GoogleBearerAuth: []
      parameters:
        - name: customerId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNSFReversalRequest"
      responses:
        "200":
          description: NSF reversal request created
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    UpdateOverdraftProtectionRequest:
      type: object
      required:
        - enabled
      properties:
        enabled:
          type: boolean
        linkedAccountId:
          type: string
        overdraftLimit:
          type: number
    CancelPADRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
        idempotencyKey:
          type: string
    CreatePADDisputeRequest:
      type: object
      required:
        - padId
        - amount
        - reason
      properties:
        padId:
          type: string
        amount:
          type: number
        reason:
          type: string
        cpaRule:
          type: string
          description: Applicable CPA rule (e.g. H1, H2, H3 for reimbursement)
        idempotencyKey:
          type: string
    CreateNSFReversalRequest:
      type: object
      required:
        - nsfFeeId
        - reason
        - idempotencyKey
      properties:
        nsfFeeId:
          type: string
        reason:
          type: string
          enum: [goodwill, policy, first_time_customer, error]
        idempotencyKey:
          type: string