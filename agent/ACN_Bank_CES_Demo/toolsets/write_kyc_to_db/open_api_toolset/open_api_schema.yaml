openapi: 3.0.3
info:
  title: ACN Bank KYC Database Write API - Direct Firestore
  version: 1.0.0
  description: Write KYC verification records directly to Firestore (Direct Firestore)
servers:
- url: $env_var
paths:
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/kyc_records:
    post:
      operationId: writeKycToDb
      summary: Create a new KYC verification record
      security:
      - GoogleBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WriteKycRequest'
      responses:
        '200':
          description: KYC record created
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Validation error
        '500':
          description: Service error
      parameters:
      - name: documentId
        in: query
        description: Set automatically (idempotency).
        schema:
          type: string
      description: Create a new KYC verification record
  /v1/projects/emvnzir-canada-song/databases/acn-bank-fs-db/documents/kyc_records/{kycId}:
    patch:
      operationId: updateKycRecord
      summary: Update an existing KYC record (e.g., after manual review)
      security:
      - GoogleBearerAuth: []
      parameters:
      - name: kycId
        in: path
        required: true
        schema:
          type: string
      - name: updateMask.fieldPaths
        in: query
        description: 'Set automatically: only these fields are changed.'
        schema:
          type: array
          items:
            type: string
      - name: currentDocument.exists
        in: query
        description: 'Set automatically: the document must already exist.'
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateKycRecordRequest'
      responses:
        '200':
          description: KYC record updated
        '404':
          description: KYC record not found
      description: Update an existing KYC record (e.g., after manual review)
components:
  securitySchemes:
    GoogleBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OAuth 2.0 access token
  schemas:
    WriteKycRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: customerId, applicationId, documentType, verificationStatus, overallConfidence, manualReviewRequired, extractedDataHash (required: applicationId, documentType, verificationStatus, overallConfidence). Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - customerId
        - applicationId
        - documentType
        - verificationStatus
        - overallConfidence
        - manualReviewRequired
        - extractedDataHash
        required:
        - applicationId
        - documentType
        - verificationStatus
        - overallConfidence
        col: null
    UpdateKycRecordRequest:
      type: object
      properties:
        fields:
          type: object
          description: 'Plain key/value map with: verificationStatus, reviewNotes, reviewedBy. Do NOT format values for Firestore; that is done for you. customerId and ids in the path are filled in automatically.'
          additionalProperties: true
      x-acn-fields:
        allow:
        - verificationStatus
        - reviewNotes
        - reviewedBy
        required: []
        col: null
